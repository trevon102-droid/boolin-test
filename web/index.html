<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boolin Analyst</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:#0b0d12;color:#eef1f6}
header{padding:20px 26px;border-bottom:1px solid #232733}
main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 80px)}
aside{border-right:1px solid #232733;padding:16px}section{padding:20px}
.card,.panel{background:#12151d;border:1px solid #272c38;border-radius:12px;padding:14px;margin-bottom:12px}
.card{cursor:pointer}.card:hover,.card.active{border-color:#69748c}.score{float:right;font-weight:800}.matchup{font-weight:700}
.meta,.label{color:#8e97a9;font-size:12px}.pill{display:inline-block;padding:3px 8px;border:1px solid #3a4150;border-radius:999px;color:#b9c0cd;font-size:11px;margin:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{font-size:23px;font-weight:800}
.flag{padding:8px;margin:7px 0;border-radius:8px;background:#241c14;border:1px solid #4b3723}
.audit-high{padding:8px;margin:7px 0;border-radius:8px;background:#2b1717;border:1px solid #623434}
.audit-med{padding:8px;margin:7px 0;border-radius:8px;background:#241c14;border:1px solid #4b3723}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:7px;border-bottom:1px solid #242936}th{color:#8992a5}
.empty{color:#8e97a9;padding:25px}
@media(max-width:900px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #232733}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Boolin Analyst</h1><div class="meta">Primary research + independent second opinion + peer audit</div></header>
<main><aside><div class="meta">RESEARCH BOARD</div><div id="board" style="margin-top:10px">Loading…</div></aside><section><div id="detail" class="empty">Select a game.</div></section></main>
<script>
const safe=v=>{let s=String(v==null?"":v);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};
const pct=v=>v==null?"—":(v*100).toFixed(1)+"%";
const fmt=v=>v==null?"—":v;
async function getJSON(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status+" "+p);return r.json();}

async function loadBoard(){
  const b=await getJSON("/research-board");
  const a=await getJSON("/audit-board");
  const map=new Map(a.map(x=>[x.game_id,x]));
  const h=document.getElementById("board");
  h.innerHTML=b.map(g=>{
    const audit=map.get(g.game_id);
    return "<div class='card' data-id='"+safe(g.game_id)+"'><span class='score'>"+g.research_score+"</span>"+
      "<div class='matchup'>"+safe(g.matchup)+"</div><div class='meta'>"+new Date(g.start_time).toLocaleString()+"</div>"+
      "<div>"+g.reasons.slice(0,2).map(x=>"<span class='pill'>"+safe(x)+"</span>").join("")+"</div>"+
      (audit?"<div class='meta' style='margin-top:6px'>Peer audit: "+safe(audit.verdict)+" • "+(audit.agreement_score*100).toFixed(0)+"%</div>":"")+
      "</div>";
  }).join("");
  h.querySelectorAll(".card").forEach(x=>x.onclick=()=>{
    h.querySelectorAll(".card").forEach(y=>y.classList.remove("active"));
    x.classList.add("active");
    loadGame(x.dataset.id);
  });
  if(b[0]){h.querySelector(".card").classList.add("active");loadGame(b[0].game_id);}
}

async function loadGame(id){
  const d=document.getElementById("detail"); d.innerHTML="Loading…";
  const [r,audit]=await Promise.all([
    getJSON("/games/"+encodeURIComponent(id)+"/research"),
    getJSON("/games/"+encodeURIComponent(id)+"/dual-audit")
  ]);
  const g=r.game,c=r.market_vs_model||{},f=r.flags||[];
  const rows=(r.market_summary||[]).map(m=>"<tr><td>"+safe(m.bookmaker)+"</td><td>"+safe(m.market)+"</td><td>"+safe(m.side)+"</td><td>"+safe(m.opening?.line??m.opening?.price)+"</td><td>"+safe(m.current?.line??m.current?.price)+"</td><td>"+safe(m.closing?.line??m.closing?.price)+"</td><td>"+safe(m.line_move??"—")+"</td></tr>").join("");
  const findings=(audit.findings||[]).map(x=>"<div class='"+(x.severity==="high"?"audit-high":"audit-med")+"'><b>"+safe(x.title)+"</b><div class='meta'>"+safe(x.explanation)+"</div>"+(x.evidence||[]).map(e=>"<div class='meta'>• "+safe(e)+"</div>").join("")+"</div>").join("");
  d.innerHTML=
    "<div class='panel'><div class='meta'>"+safe(g.league)+" • "+new Date(g.start_time).toLocaleString()+"</div><h2>"+safe(g.away_team)+" @ "+safe(g.home_team)+"</h2><div class='meta'>"+safe(g.venue)+"</div><span class='pill'>Primary decision: "+safe(g.decision)+"</span></div>"+
    "<div class='grid'><div class='panel'><div class='label'>MARKET WIN PROB.</div><div class='metric'>"+pct(c.market_win_probability)+"</div></div><div class='panel'><div class='label'>BOOLIN WIN PROB.</div><div class='metric'>"+pct(c.model_win_probability)+"</div></div><div class='panel'><div class='label'>PROBABILITY DELTA</div><div class='metric'>"+pct(c.probability_delta)+"</div></div></div>"+
    "<div class='panel'><h3>Independent Second Opinion</h3><div><span class='pill'>Decision: "+safe(audit.independent.decision)+"</span><span class='pill'>Confidence: "+pct(audit.independent.confidence)+"</span><span class='pill'>Data: "+safe(audit.independent.data_quality)+"</span></div><p class='meta'>"+safe(audit.independent.methodology)+"</p><div><b>Market probability:</b> "+pct(audit.independent.market_probability)+" • <b>Spread:</b> "+fmt(audit.independent.market_spread)+" • <b>Total:</b> "+fmt(audit.independent.market_total)+"</div></div>"+
    "<div class='panel'><h3>Peer Audit</h3><div><span class='pill'>Verdict: "+safe(audit.verdict)+"</span><span class='pill'>Agreement: "+(audit.agreement_score*100).toFixed(0)+"%</span></div>"+(findings||"<div class='meta' style='margin-top:8px'>No audit findings.</div>")+
    "<h4>Questions for Review</h4><ul>"+(audit.questions_for_review||[]).map(q=>"<li>"+safe(q)+"</li>").join("")+"</ul></div>"+
    "<div class='panel'><h3>Primary Market vs Model</h3><div>Current spread: <b>"+fmt(c.market_spread)+"</b> • Projected: <b>"+fmt(c.projected_spread)+"</b> • Delta: <b>"+fmt(c.spread_delta)+"</b></div><span class='pill'>"+safe(c.disagreement||"unknown")+"</span></div>"+
    "<div class='panel'><h3>Primary Research Flags</h3>"+(f.length?f.map(x=>"<div class='flag'><b>"+safe(x.title)+"</b><div class='meta'>"+safe(x.explanation)+"</div></div>").join(""):"<div class='meta'>No major flags.</div>")+"</div>"+
    "<div class='panel'><h3>Evidence</h3><b>Supporting</b><ul>"+(r.supporting_evidence||[]).map(x=>"<li>"+safe(x)+"</li>").join("")+"</ul><b>Contradicting</b><ul>"+(r.contradicting_evidence||[]).map(x=>"<li>"+safe(x)+"</li>").join("")+"</ul><b>Unknowns</b><ul>"+(r.unknowns||[]).map(x=>"<li>"+safe(x)+"</li>").join("")+"</ul></div>"+
    "<div class='panel'><h3>Market Timeline</h3><table><tr><th>Book</th><th>Market</th><th>Side</th><th>Open</th><th>Current</th><th>Close</th><th>Move</th></tr>"+(rows||"<tr><td colspan='7'>No market history.</td></tr>")+"</table></div>"+
    "<div class='panel'><h3>Freshness</h3>"+(r.freshness||[]).map(x=>"<div style='padding:7px 0;border-bottom:1px solid #242936'><b>"+safe(x.source)+"</b> <span class='pill'>"+safe(x.health)+"</span> <span class='meta'>"+safe(x.age_minutes)+" min old • "+safe(x.source_type)+"</span></div>").join("")+"</div>"+
    "<div class='panel'><h3>Scenarios</h3>"+((r.scenarios||[]).length?(r.scenarios||[]).map(x=>"<div style='padding:7px 0;border-bottom:1px solid #242936'><b>"+safe(x.name)+"</b><div class='meta'>"+safe(x.assumption)+"</div><div>Prob "+pct(x.projected_probability)+" • Spread "+fmt(x.projected_spread)+" • Total "+fmt(x.projected_total)+"</div></div>").join(""):"<div class='meta'>No scenarios stored.</div>")+"</div>";
}
loadBoard().catch(e=>document.getElementById("board").innerHTML="<div class='empty'>"+safe(e.message)+"</div>");
</script>
</body></html>
